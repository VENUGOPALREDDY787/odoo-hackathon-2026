services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dealflow_root_pass_2026
      MYSQL_DATABASE: dealflow360
      MYSQL_USER: dealflow
      MYSQL_PASSWORD: dealflow_pass_2026
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD-SHELL', "mysql -h localhost -u dealflow -pdealflow_pass_2026 -D dealflow360 -e 'SELECT 1 FROM users LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  db-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: 'no'
    command: ['node', 'src/scripts/seed.js']
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: dealflow
      DB_PASSWORD: dealflow_pass_2026
      DB_NAME: dealflow360
      DB_CONNECTION_LIMIT: 10
      DB_SSL: 'false'
      JWT_SECRET: dealflow-review-access-secret-2026-change-me
      JWT_REFRESH_SECRET: dealflow-review-refresh-secret-2026-change-me
      BCRYPT_ROUNDS: 12
      LOG_LEVEL: info
      LOG_PRETTY: 'true'
    depends_on:
      mysql:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Backend — CPU-limited so the autoscaler has a real ceiling to react to.
  # Scale with:  docker compose up -d --scale backend=N
  # Each replica runs its own BullMQ worker (embedded in the backend).
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: dealflow
      DB_PASSWORD: dealflow_pass_2026
      DB_NAME: dealflow360
      DB_CONNECTION_LIMIT: 10
      DB_SSL: 'false'
      JWT_SECRET: dealflow-review-access-secret-2026-change-me
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dealflow-review-refresh-secret-2026-change-me
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      LOG_LEVEL: info
      LOG_PRETTY: 'true'
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      ENABLE_SWAGGER: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONCURRENCY: '5'
      EXPORT_DIR: /app/exports
      INSTANCE_ID: ${INSTANCE_ID:-backend-1}
    ports:
      - '3000'   # host port auto-assigned per replica (proxied through nginx)
    volumes:
      - exports_data:/app/exports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/ready').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ------------------------------------------------------------------
  # Frontend — static SPA container (unchanged behavior, port remapped)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy

  # ------------------------------------------------------------------
  # nginx load balancer — single public entry point.
  #   http://localhost:8080  -> SPA
  #   http://localhost:8080/api -> backend replicas (least_conn)
  #   http://localhost:8080/socket.io -> websockets
  # ------------------------------------------------------------------
  nginx-lb:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_SERVICE: backend
      BACKEND_PORT: '3000'
      RESOLVE_INTERVAL: '5'
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  # ------------------------------------------------------------------
  # Autoscaler watcher — polls CPU of backend replicas via the Docker
  # socket. Scale up at >=70% of a replica's CPU limit; scale down one
  # replica at a time after 3 minutes of full idleness. Floor: 2, cap: 6.
  # ------------------------------------------------------------------
  autoscaler:
    build:
      context: ./docker/autoscaler
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      BACKEND_SERVICE: backend
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-}
      COMPOSE_FILE: /compose/docker-compose.yml
      MIN_REPLICAS: '2'
      MAX_REPLICAS: '6'
      SCALE_UP_CPU_THRESHOLD: '0.70'
      SCALE_DOWN_IDLE_CPU: '0.20'
      SCALE_DOWN_IDLE_MS: '180000'
      SCALE_UP_COOLDOWN_MS: '60000'
      POLL_INTERVAL_MS: '10000'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      QUEUE_NAME: dealflow-requests
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      # backend image context is NOT mounted: scale actions use --no-build
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  exports_data:
