services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dealflow_root_pass_2026
      MYSQL_DATABASE: dealflow360
      MYSQL_USER: dealflow
      MYSQL_PASSWORD: dealflow_pass_2026
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD-SHELL', "mysql -h localhost -u dealflow -pdealflow_pass_2026 -e 'SELECT 1 FROM users LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: dealflow
      DB_PASSWORD: dealflow_pass_2026
      DB_NAME: dealflow360
      DB_CONNECTION_LIMIT: 10
      DB_SSL: 'false'
      JWT_SECRET: dealflow-review-access-secret-2026-change-me
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dealflow-review-refresh-secret-2026-change-me
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      LOG_LEVEL: info
      LOG_PRETTY: 'true'
      CORS_ORIGIN: http://localhost:5173
      ENABLE_SWAGGER: 'false'
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/ready').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
