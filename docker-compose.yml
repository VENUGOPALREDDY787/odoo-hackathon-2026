services:
  mysql:
    image: mysql:8.0
    container_name: dealflow360-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dealflow_root_pass_2026
      MYSQL_DATABASE: dealflow360
      MYSQL_USER: dealflow
      MYSQL_PASSWORD: dealflow_pass_2026
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'dealflow', '-pdealflow_pass_2026']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dealflow360-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
